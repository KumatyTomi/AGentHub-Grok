# AgentMesh monitoring — Prometheus + Grafana (LAN only)
# Run on BETA (or any PC that can scrape mesh-core :8765)
#
#   cd monitoring
#   set MESH_CORE_TARGET=host.docker.internal:8765   # Windows Docker
#   # or: MESH_CORE_TARGET=10.20.0.20:8765
#   docker compose up -d
#
# Grafana:  http://localhost:3000  (admin / agentmesh)
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agentmesh-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: agentmesh-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agentmesh
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
